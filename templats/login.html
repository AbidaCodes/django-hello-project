{% extends "base.html" %}

{% block title %}Login{% endblock title %}

{% block body %}

<div class="container">
    <h1>Login</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Login
        </button>
    </form>
</div>

{% endblock body %}
