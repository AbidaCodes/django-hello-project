{% extends "base.html" %}

{% block title %}Set Password{% endblock title %}

{% block body %}

<div class="container">
    <h1>Set Your Password</h1>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password"
                   class="form-control"
                   id="password"
                   name="password"
                   placeholder="Enter your password"
                   required>
        </div>

        <div class="mb-3">
            <label for="confirm_password" class="form-label">
                Confirm Password
            </label>
            <input type="password"
                   class="form-control"
                   id="confirm_password"
                   name="confirm_password"
                   placeholder="Enter your password again"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Set Password
        </button>
    </form>
</div>

{% endblock body %}
